name: Daily Supertrend Screener

on:
  schedule:
    # 09:15 UTC = 16:15 WIB (Senin - Jumat)
    - cron: "15 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Supertrend Screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHLIST: "BBCA,BBRI,TLKM,ASII,ANTM"
          ATR_PERIOD: "10"
          ATR_MULTIPLIER: "1.0"
          STATE_FILE: "state/sent_signals.json"
        run: python screener.py

      - name: Commit updated signal state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/sent_signals.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update sent Supertrend signals"
            git push
          fi
